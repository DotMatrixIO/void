# Pre-deploy SRI gate (task #294).
#
# `artifacts/void-client/src/__tests__/sri.test.ts` self-skips when
# `dist/public/` is absent, so a CI job that runs `pnpm test` without
# first building can report green even when the SRI post-build chain
# (gen-og-pages / add-sri / add-modulepreload-sri) is silently broken.
# This workflow closes that gap: build first, verify the build emitted
# the files the SRI tests inspect, then run the test suite with
# `STRICT_SRI=1` so a missing build becomes a hard failure.

name: void-client SRI pre-deploy gate

on:
  push:
    branches: [main]
    paths:
      - "artifacts/void-client/**"
      - "attached_assets/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/void-client-sri.yml"
  pull_request:
    branches: [main]
    paths:
      - "artifacts/void-client/**"
      - "attached_assets/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/void-client-sri.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sri-gate:
    name: Build void-client and run SRI tests against dist/public
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Preflight — required release build variables are set
        # VITE_VOID_ONION_HOST and PUBLIC_ORIGIN are both baked into the
        # production void-client bundle, and a NODE_ENV=production build fails
        # CLOSED without them (onion-bake guard in vite.config.ts + gen-og-pages
        # strict mode). That failure otherwise surfaces deep in the build with a
        # cryptic exit, so assert both up front with an actionable message that
        # names the exact repository variable and where to set it. Keep this
        # block byte-identical with the same preflight in
        # .github/workflows/release.yml.
        env:
          VITE_VOID_ONION_HOST: ${{ vars.VITE_VOID_ONION_HOST }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${VITE_VOID_ONION_HOST:-}" ]; then
            echo "::error::Repository variable VITE_VOID_ONION_HOST is not set. It is baked into the production bundle's Tor onion link and a NODE_ENV=production build fails closed without it. Set it to the deployment's <56-char-base32>.onion host."
            missing=1
          fi
          if [ -z "${PUBLIC_ORIGIN:-}" ]; then
            echo "::error::Repository variable PUBLIC_ORIGIN is not set. gen-og-pages bakes it into every social card's absolute og:url/og:image and a NODE_ENV=production build fails closed without it. Set it to the canonical origin, e.g. https://void.example.com."
            missing=1
          elif ! printf '%s' "$PUBLIC_ORIGIN" | grep -qiE '^https?://[^/]+/?$'; then
            echo "::error::Repository variable PUBLIC_ORIGIN='${PUBLIC_ORIGIN}' must be an absolute http(s) origin with no path, e.g. https://void.example.com. gen-og-pages rejects anything else."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::Set the variable(s) above under: repository Settings -> Secrets and variables -> Actions -> Variables. These are public repository VARIABLES, not secrets."
            exit 1
          fi
          echo "Preflight OK: VITE_VOID_ONION_HOST and PUBLIC_ORIGIN are set."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm (pinned, matches pnpm-audit.yml)
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Preflight — required build variables set and valid
        # Same guard as release.yml. A NODE_ENV=production build fails closed
        # if VITE_VOID_ONION_HOST (onion-bake guard, vite.config.ts) or
        # PUBLIC_ORIGIN (gen-og-pages.mjs) is unset, but that failure surfaces
        # deep inside the build. Assert them up front with an actionable
        # remediation message so a forgotten repo variable is obvious.
        env:
          VITE_VOID_ONION_HOST: ${{ vars.VITE_VOID_ONION_HOST }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
        run: |
          set -euo pipefail
          fail=0
          where="GitHub -> Settings -> Secrets and variables -> Actions -> Variables tab"

          onion="${VITE_VOID_ONION_HOST:-}"
          if [ -z "$onion" ]; then
            echo "::error::Required repository variable VITE_VOID_ONION_HOST is not set. It is the canonical Tor v3 .onion mirror host baked into the production void-client bundle. Set it in ${where} to your deployment's <56-char-base32>.onion host, then re-run. (See README-selfhost.md §6e.)"
            fail=1
          else
            host=$(printf '%s' "$onion" | sed -E 's#^https?://##I; s#/.*$##; s#\.+$##' | tr 'A-Z' 'a-z')
            if ! printf '%s' "$host" | grep -Eq '(^|\.)[a-z2-7]{56}\.onion$'; then
              echo "::error::Repository variable VITE_VOID_ONION_HOST='${onion}' is not a syntactically valid Tor v3 .onion host (expected a 56-character base32 [a-z2-7] label immediately before \".onion\"). Fix it in ${where}, then re-run."
              fail=1
            fi
          fi

          origin="${PUBLIC_ORIGIN:-}"
          if [ -z "$origin" ]; then
            echo "::error::Required repository variable PUBLIC_ORIGIN is not set. It is the absolute origin baked into the social-card OG pages by gen-og-pages.mjs. Set it in ${where} to an absolute root URL (e.g. https://void.example.com or https://<56-char-base32>.onion), then re-run."
            fail=1
          elif ! printf '%s' "$origin" | grep -Eq '^https?://[^/]+/?$'; then
            echo "::error::Repository variable PUBLIC_ORIGIN='${origin}' is not an absolute root URL. Expected an http(s) scheme and a bare host with no path, e.g. https://void.example.com. Fix it in ${where}, then re-run."
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::Preflight failed: one or more required build variables are missing or malformed (see errors above). No build steps ran. The NODE_ENV=production build fails closed without them by design."
            exit 1
          fi
          echo "Preflight OK: VITE_VOID_ONION_HOST and PUBLIC_ORIGIN are set and well-formed."

      - name: Build void-client (production)
        # PORT and BASE_PATH are required at vite.config.ts load time.
        # Values match the production Dockerfile; keep them in sync if
        # the Dockerfile ever changes.
        env:
          NODE_ENV: production
          PORT: "3000"
          BASE_PATH: /
          # A NODE_ENV=production build fails closed twice: the onion-bake guard
          # (vite.config.ts) needs a valid v3 VITE_VOID_ONION_HOST, and
          # gen-og-pages needs an absolute PUBLIC_ORIGIN. Both are sourced from
          # the public repo VARIABLES, same as release.yml. Their exact values
          # don't affect SRI (this job only checks integrity attributes), but
          # they must be present or the build never reaches the SRI step.
          VITE_VOID_ONION_HOST: ${{ vars.VITE_VOID_ONION_HOST }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
        run: pnpm --filter @workspace/void-client run build

      - name: Verify build outputs exist
        # Belt-and-braces: the STRICT_SRI assertion in sri.test.ts will
        # also catch this, but failing here gives a clearer error.
        run: |
          set -euo pipefail
          DIST=artifacts/void-client/dist/public
          if [ ! -f "$DIST/index.html" ]; then
            echo "::error::Build did not produce $DIST/index.html"
            exit 1
          fi
          if [ ! -f "$DIST/.vite/manifest.json" ]; then
            echo "::error::Build did not produce $DIST/.vite/manifest.json"
            exit 1
          fi

      - name: Run SRI regression tests (strict mode)
        # Scoped to the SRI test file: this gate exists to validate the
        # post-build SRI chain on every release candidate. Running the
        # full `pnpm test` suite would couple this gate to unrelated
        # test failures (RoomPage, etc.) that have their own CI/Replit
        # workflow coverage. STRICT_SRI=1 turns the self-skip-on-
        # missing-build behaviour in sri.test.ts into a hard failure.
        env:
          STRICT_SRI: "1"
        run: |
          pnpm --filter @workspace/void-client exec vitest run \
            --config vitest.config.ts \
            src/__tests__/sri.test.ts
