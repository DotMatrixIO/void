# SPDX-License-Identifier: AGPL-3.0-or-later
name: Bug report
description: Something VOID does is wrong or broken.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Not for security issues. If this is a vulnerability, stop and read
        `SECURITY.md` — report it privately, not here.

        Not for new features. Use the feature request template, and read
        `VOID-Feature-Policy.md` first.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you file
      options:
        - label: This is not a security/privacy vulnerability (those go through SECURITY.md, privately).
          required: true
        - label: I searched existing issues and this is not a duplicate.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, and what went wrong? Be concrete.
      placeholder: I opened a room with 3 people and the fourth join failed with...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps. A reliable repro is the difference between a fix and a shrug.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build / version
      description: The running build SHA from /proof/runtime, or the release tag. If self-hosted, say so.
      placeholder: e.g. /proof/runtime shows 1a2b3c4, or v0.5
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Hosted instance (someone else runs it)
        - Self-hosted (I run it)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser + version, OS, and anything relevant (VPN, mobile, etc.).
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Console errors, screenshots, network conditions. Do not paste secrets, tokens, or full room invites.
    validations:
      required: false
