manifestVersion: 1
id: void
name: VOID
tagline: Ephemeral, end-to-end encrypted P2P video over Lightning
icon: https://raw.githubusercontent.com/DotMatrixIO/void/main/void-icon.png
category: communication
version: "1.2.0"
port: 3000
description: >-
  VOID is an ephemeral, end-to-end encrypted peer-to-peer video
  conferencing app. No accounts, no database, no logs. Rooms hold
  up to 4 participants, and expire automatically (65 minutes on
  the standard tier, 24 hours on the day tier). Live per-socket
  room state (peers, sockets, pending knocks) is in process
  memory and dies on restart; the only thing written to disk is a
  minimal paid-room metadata snapshot (paid window, tier, room
  type, moderation flags, and host-reclaim tokens — never room
  content or payment identifiers) that is rehydrated across a
  restart so a paid host who refreshes mid-window need not
  re-pay, and is dropped once the paid window expires. The host
  pays a
  Lightning invoice (1,000 sats on the standard tier) to create a
  room and is issued a one-time 4-word BIP-39 recovery code so
  the room can be reclaimed within the paid window after a tab
  close. Joiners enter free using the room phrase, which is
  shared via the URL fragment and never sent to the server. Media
  flows browser-to-browser over WebRTC; an optional TURN relay
  handles NAT traversal and IP hiding. The signaling server is
  unable to decrypt session traffic (per-session ECDH P-384 with
  Ed25519 signed-hello binding; AES-GCM payloads; argon2id
  m=64 MiB / t=3 / p=1 phrase derivation). This distribution
  ships the human video/audio product only — VOID is human-only;
  all agent code has been removed.
developer: DotMatrixIO
