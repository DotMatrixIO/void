# StartOS config validation rules for VOID.
#
# These cross-field rules are evaluated by `compat config set` (the StartOS
# "Config" screen Save) and surface as an at-save-time error in the UI instead
# of a deferred runtime failure. Each rule here has been exercised against the
# real `start9/compat` packaging tool (the exact binary manifest.yaml's
# config.set invokes): valid configs are accepted and the targeted invalid
# config is rejected with the rule's description.
#
# Rule-language notes (verified against start9/compat:latest, 2026-06-12):
#   - References are kebab-case: `#field` for a number, `'field` for a string
#     (no closing quote). This is why config_spec.yaml uses kebab-case keys —
#     a reference to an underscore key (`#paywall_jitter_min_ms`) fails to parse.
#   - Operators: `=` / `!=`, `<` / `>` (single-char; there is no `<=`/`>=`),
#     `!( ... )` to negate, and UPPERCASE `AND` / `OR` / `XOR`.
#
# Why only the jitter ordering rule is here (the rest stay fail-closed in the
# server): the rule engine cannot reliably express "a nullable string is set".
# An unset nullable normalises to null, and `'lnbits-url != ""` evaluates TRUE
# for null (null is unequal to every string literal, and there is no null/exists
# literal in the grammar). So a "LNbits URL required when backend is lnbits" rule
# would pass the realistic blank-field case and give operators false confidence.
# Those backend-credential requirements therefore remain enforced fail-closed by
# the API server itself (services/lightning.ts fails closed on the first invoice;
# placeholder TURN_SECRET / PAYWALL_SECRET abort startup before any port bind).
# The jitter ordering rule is safe to enforce here because both operands are
# non-nullable numbers, so the comparison is always well-defined.

# Paywall jitter window must not be inverted. Equal bounds (a fixed delay) are
# allowed; only min > max is rejected. Mirrors the routes/paywall.ts guard that
# would otherwise silently collapse the delay window at runtime.
- rule: "!(#paywall-jitter-min-ms > #paywall-jitter-max-ms)"
  description: "Paywall Jitter Minimum must not exceed Paywall Jitter Maximum."
