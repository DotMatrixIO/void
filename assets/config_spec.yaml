# StartOS config spec for VOID.
#
# This file is the operator-facing settings surface that StartOS renders as
# the package "Config" screen. The `config.get` / `config.set` procedures in
# manifest.yaml run the StartOS `compat` image against this spec (and against
# config_rules.yaml). `compat config set` validates the operator's choices
# (including the cross-field rules in config_rules.yaml) and writes them to
# `/root/start9/config.yaml` on the package's data volume; `docker_entrypoint.mjs`
# (the `main` action's entrypoint) reads that file at boot and exports each field
# as the matching UPPER_SNAKE_CASE environment variable the API server already
# consumes (e.g. `lightning-backend` -> `LIGHTNING_BACKEND`).
#
# Field keys are kebab-case. This is the StartOS-native id form (`^[a-z]+(-[a-z]+)*$`)
# and, critically, the only form the `compat` config-rule engine can reference:
# a rule expression that names `paywall_jitter_min_ms` fails to parse, while
# `#paywall-jitter-min-ms` resolves. The entrypoint converts each key's hyphens
# to underscores before uppercasing, so the env var names the server reads are
# unchanged (`paywall-jitter-min-ms` -> `PAYWALL_JITTER_MIN_MS`).
#
# Defaults below MUST match the code defaults so that an operator who accepts
# the defaults gets the same behaviour as a plain `docker run` with nothing
# set:
#   - turn-credential-ttl 4500   (artifacts/api-server/src/routes/ice-servers.ts)
#   - paywall-jitter-min-ms 10000, paywall-jitter-max-ms 60000 (routes/paywall.ts)
#   - trust-proxy-hops 1         (app.ts / lib/clientIp.ts)
#   - log-level "warn"           (lib/logger.ts)
#   - lightning-backend "mock"   (services/lightning.ts)
#   - ntfy-server https://ntfy.sh (lib/ntfy.ts)
#
# Booleans map to the string "1" (true) / "0" (false) the code tests for;
# empty/null optional strings are left unset so the server's own fallbacks apply.

lightning-backend:
  type: enum
  name: Lightning Backend
  description: >-
    Which Lightning backend mints and settles room-creation invoices. "mock"
    is development-only — mock invoices can only be settled via
    /api/paywall/dev-pay, which is disabled when NODE_ENV=production (it is in
    this image). Choose lnbits or btcpay for a real paid-room deployment and
    fill in the matching credentials below.
  values:
    - mock
    - lnbits
    - btcpay
  value-names:
    mock: Mock (development only)
    lnbits: LNbits
    btcpay: BTCPay Server
  default: mock

paywall-secret:
  type: string
  name: Paywall Secret
  description: >-
    32-byte hex (openssl rand -hex 32). HMAC key that signs host-authorization
    JWTs. Optional on a single instance — when unset, a strong ephemeral
    per-process secret is generated and JWTs invalidate on restart by design.
    The server refuses to start if this is set to a known placeholder value.
  nullable: true
  masked: true
  pattern: "^[0-9a-fA-F]{64}$"
  pattern-description: 64 hexadecimal characters (the output of `openssl rand -hex 32`).

lnbits-url:
  type: string
  name: LNbits URL
  description: Base URL of your LNbits instance. Required when Lightning Backend is "lnbits".
  nullable: true

lnbits-api-key:
  type: string
  name: LNbits API Key
  description: LNbits invoice/read API key. Required when Lightning Backend is "lnbits".
  nullable: true
  masked: true

btcpay-url:
  type: string
  name: BTCPay URL
  description: Base URL of your BTCPay Server. Required when Lightning Backend is "btcpay".
  nullable: true

btcpay-api-key:
  type: string
  name: BTCPay API Key
  description: BTCPay Server Greenfield API key. Required when Lightning Backend is "btcpay".
  nullable: true
  masked: true

btcpay-store-id:
  type: string
  name: BTCPay Store ID
  description: BTCPay Server store ID. Required when Lightning Backend is "btcpay".
  nullable: true

turn-url:
  type: string
  name: TURN URL
  description: >-
    TURN relay URL for WebRTC NAT traversal — either the bundled/StartOS Coturn
    service or an external provider that supports HMAC-SHA1 ephemeral
    credentials. Leave unset only for LAN/same-NAT testing; most cross-NAT
    calls will not connect without it.
  nullable: true

turn-secret:
  type: string
  name: TURN Secret
  description: >-
    The TURN static-auth shared secret (matches Coturn's static-auth-secret).
    The server refuses to start if this is set to a known placeholder value.
  nullable: true
  masked: true

turn-credential-ttl:
  type: number
  name: TURN Credential TTL
  description: >-
    Lifetime, in seconds, of the ephemeral HMAC-SHA1 TURN credentials the
    server mints. Default 4500 = the 3900s room TTL plus a 10-minute safety
    buffer.
  nullable: false
  range: "[1,*)"
  integral: true
  default: 4500
  units: seconds

stun-url:
  type: string
  name: STUN URL
  description: >-
    STUN server URL for ICE candidate gathering. Ignored under the Tor-only
    posture (a STUN request would leak each peer's public IP to a clearnet
    third party).
  nullable: true

trust-proxy-hops:
  type: number
  name: Trusted Proxy Hops
  description: >-
    How many reverse proxies sit in front of the app. The server reads the Nth
    rightmost X-Forwarded-For token so per-IP caps and join throttles cannot be
    bypassed by a spoofed leftmost hop. Raise only if you add proxies.
  nullable: false
  range: "[0,*)"
  integral: true
  default: 1

log-level:
  type: enum
  name: Log Level
  description: Server log verbosity (pino levels).
  values:
    - trace
    - debug
    - info
    - warn
    - error
    - fatal
    - silent
  default: warn

tor-only:
  type: boolean
  name: Tor-only Runtime Posture
  description: >-
    Activates the onion-only runtime posture (set this alongside removing the
    LAN interface from the manifest). /api/ice-servers omits any configured
    STUN URL, the startup banner confirms the posture, and the server warns if
    TURN is not a turns: relay on a .onion host.
  default: false

paywall-jitter-min-ms:
  type: number
  name: Paywall Jitter Minimum
  description: >-
    Lower bound, in milliseconds, of the random delay inserted between
    Lightning payment confirmation and room creation. Weakens passive
    payment-to-room timing correlation.
  nullable: false
  range: "[0,*)"
  integral: true
  default: 10000
  units: ms

paywall-jitter-max-ms:
  type: number
  name: Paywall Jitter Maximum
  description: >-
    Upper bound, in milliseconds, of the settlement-to-room-create delay.
    Must be greater than or equal to the minimum.
  nullable: false
  range: "[0,*)"
  integral: true
  default: 60000
  units: ms

paywall-jitter-disable:
  type: boolean
  name: Disable Paywall Jitter
  description: >-
    Turns off the settlement-to-room-create delay entirely. Only enable this if
    passive payment-to-room timing correlation is not part of your threat model.
  default: false

ntfy-topic:
  type: string
  name: ntfy Topic
  description: >-
    ntfy topic that receives operator alerts (CSP report waves, Lightning
    response-shape drift, sustained payment 503s, and new High/Critical CVEs).
    Leave unset to disable alerting (silent no-op). Treat the topic as a secret.
  nullable: true
  masked: true

ntfy-server:
  type: string
  name: ntfy Server
  description: ntfy server base URL.
  nullable: true
  default: https://ntfy.sh

ntfy-token:
  type: string
  name: ntfy Token
  description: Bearer token for an access-controlled ntfy server. Optional.
  nullable: true
  masked: true
