# ─── VOID Coturn Configuration — CI / TEST RELAY ONLY ────────────────
# This config is for the connection-smoke CI job (.github/workflows/
# connection-smoke.yml). It is deliberately MORE PERMISSIVE than the
# production example (coturn/turnserver.conf.example):
#
#   * It carries NO static-auth-secret line. The secret is injected at
#     launch via the CLI override `--static-auth-secret=$TURN_SECRET`
#     (generated fresh per CI run), so no secret is ever committed.
#   * It does NOT deny loopback/private peer ranges. In CI both WebRTC
#     peers connect from RFC-1918 addresses on the runner, so coturn must
#     be allowed to relay to those ranges or every allocation is rejected
#     and no connection forms.
#
# ⚠️  Single-host CANNOT produce a relay/relay pair. coturn matches TURN
#     permissions by *peer IP only*. When a peer's base-socket IP equals
#     coturn's relay-ip (the single-host case — everything is 127.0.0.1 or
#     one docker-bridge IP), the direct base→relay shortcut is wrongly
#     permitted and ICE forms a host/prflx pair, so the SDK's relay-only
#     verifier fails. The fix — enforced by the workflow — is two-fold:
#       1. Each peer runs in its OWN network namespace with NO route to the
#          other peer (hard isolation; the only reachable transport is the
#          relay), and
#       2. coturn's relay-ip is a dedicated address that DIFFERS from every
#          peer's base-socket IP, so even an attempted shortcut is dropped
#          by the permission-by-IP check.
#     Because both listening-ip and relay-ip are topology-specific, they are
#     NOT set here — the workflow passes them at launch (see below). Setting
#     them in this file would also be merged-not-replaced by coturn's CLI,
#     producing multi-IP ambiguity.
#
# ⚠️  DO NOT use this config for a public/production relay. Allowing private
#     and loopback peer ranges on an internet-reachable coturn enables SSRF
#     into internal services. The ephemeral CI relay is torn down after the
#     run and is not internet-reachable, so the trade-off is safe there only.
#     For production, use coturn/turnserver.conf.example (which keeps the
#     denied-peer-ip hardening).
#
# Launch (CI — see coturn/ci-netns-setup.sh for the addresses):
#   turnserver -c coturn/turnserver.ci.conf \
#     --static-auth-secret="$TURN_SECRET" \
#     --listening-ip=10.99.0.1 --relay-ip=10.99.0.1
# ─────────────────────────────────────────────────────────────────────

# ── Networking ──
listening-port=3478
# listening-ip / relay-ip are passed at launch by the workflow (see header).
# relay-ip MUST differ from every peer's base-socket IP, or coturn's
# permission-by-IP check lets the direct base→relay shortcut through and the
# relay/relay pair never forms.

# Restrict relay port range (keeps the ephemeral allocation window small).
min-port=49152
max-port=65535

# ── Authentication ──
# Ephemeral HMAC-SHA1 credential mode. The API server (routes/ice-servers.ts)
# mints time-limited credentials against the SAME secret. The secret itself is
# supplied at launch via --static-auth-secret (NOT stored in this file).
use-auth-secret

# ── Realm ──
realm=void.ci.local

# ── Security hardening (CI-appropriate subset) ──
# Note: the denied-peer-ip blocks from the production example are intentionally
# omitted here — see the header for why. Loopback/private relay must be allowed
# for same-host / runner-local peers to connect.
no-multicast-peers
no-cli

# ── Logging ──
# Log to stdout so CI captures relay activity in the job log for debugging.
log-file=stdout
verbose
