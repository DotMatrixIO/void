<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <filter id="concrete">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
      <feBlend in="SourceGraphic" in2="grey" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="630" fill="#14110D"/>

  <!-- Concrete texture overlay -->
  <rect width="1200" height="630" fill="#14110D" filter="url(#concrete)" opacity="0.4"/>

  <!-- Bottom strip -->
  <rect x="0" y="520" width="1200" height="110" fill="#1E1A14"/>
  <line x1="0" y1="520" x2="1200" y2="520" stroke="#2A2520" stroke-width="2"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="7" height="630" fill="#C85A00"/>

  <!-- Right accent bar -->
  <rect x="1193" y="0" width="7" height="630" fill="#0D9D8B"/>

  <!-- Corner brackets - top left -->
  <polyline points="40,28 28,28 28,80" stroke="#E8A200" stroke-width="3" fill="none" opacity="0.8"/>
  <!-- Corner brackets - top right -->
  <polyline points="1160,28 1172,28 1172,80" stroke="#E8A200" stroke-width="3" fill="none" opacity="0.8"/>
  <!-- Corner brackets - bottom left -->
  <polyline points="40,602 28,602 28,550" stroke="#E8A200" stroke-width="3" fill="none" opacity="0.8"/>
  <!-- Corner brackets - bottom right -->
  <polyline points="1160,602 1172,602 1172,550" stroke="#E8A200" stroke-width="3" fill="none" opacity="0.8"/>

  <!-- Main logotype: V [_] I D -->
  <text x="600" y="310" font-family="DejaVu Sans,sans-serif" font-weight="bold" font-size="188" fill="#E8A200" text-anchor="middle" letter-spacing="24" filter="url(#glow)">V [  ] I D</text>

  <!-- Subtitle -->
  <text x="600" y="400" font-family="DejaVu Sans Mono,monospace" font-weight="normal" font-size="22" fill="#0D9D8B" text-anchor="middle" letter-spacing="8">ENCRYPTED PEER-TO-PEER VIDEO</text>

  <!-- Thin separator line above subtitle -->
  <line x1="340" y1="425" x2="860" y2="425" stroke="#2A2520" stroke-width="1" opacity="0.8"/>

  <!-- Bottom strip content -->
  <text x="260" y="578" font-family="DejaVu Sans Mono,monospace" font-size="18" fill="#BEB3A2" text-anchor="middle" letter-spacing="3">NO ACCOUNTS</text>
  <line x1="460" y1="548" x2="460" y2="608" stroke="#3A3530" stroke-width="1"/>
  <text x="600" y="578" font-family="DejaVu Sans Mono,monospace" font-size="18" fill="#BEB3A2" text-anchor="middle" letter-spacing="3">NO LOGS</text>
  <line x1="740" y1="548" x2="740" y2="608" stroke="#3A3530" stroke-width="1"/>
  <text x="940" y="578" font-family="DejaVu Sans Mono,monospace" font-size="18" fill="#BEB3A2" text-anchor="middle" letter-spacing="3">NO METADATA</text>

  <!-- Horizontal rule above bottom strip labels -->
  <line x1="200" y1="544" x2="1000" y2="544" stroke="#2A2520" stroke-width="1" opacity="0.5"/>
</svg>
