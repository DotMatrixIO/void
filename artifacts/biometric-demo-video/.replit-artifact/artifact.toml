kind = "video"
previewPath = "/biometric-demo-video/"
title = "Biometric Demo Video"
version = "1.0.0"
id = "artifacts/biometric-demo-video"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/biometric-demo-video/" ]
localPort = 22687

[services.development]
run = "pnpm --filter @workspace/biometric-demo-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/biometric-demo-video", "run", "build" ]
publicDir = "artifacts/biometric-demo-video/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22687"
BASE_PATH = "/biometric-demo-video/"
